<!-- /templates/sections/skills.html -->
<section class="skills section">
    <h2 class="section-title">Skills</h2>
    <div class="skill-categories">
        <button class="skill-category active" data-category="all">All</button>
        <button class="skill-category" data-category="frontend">Frontend</button>
        <button class="skill-category" data-category="backend">Backend</button>
        <button class="skill-category" data-category="tools">Tools</button>
    </div>
    <div id="skills" class="skill-visualization">
        <canvas id="skill-canvas"></canvas>
        <div class="skill-details">
            <div class="skill-info">
                <p class="skill-name">Hover over skills to see details</p>
                <p class="skill-level">-</p>
                <p class="skill-description">Explore my skills by hovering over the nodes in the visualization.</p>
            </div>
        </div>
    </div>
</section>
