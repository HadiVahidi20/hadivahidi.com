<!-- /templates/sections/experience.html -->
<!-- Updated Experience Section - Now Dynamic (Database-Driven) -->
<section class="experience section">
    <h2 class="section-title">Experience</h2>
    <div id="experience" class="timeline-container">
        <div class="timeline">
            <div class="timeline-line"></div>
            <!-- Timeline items will be dynamically loaded from database -->
            <div class="timeline-loading">
                <div class="loading-spinner"></div>
                <p>Loading experience...</p>
            </div>
        </div>
    </div>
</section>

<style>
/* Loading spinner styles */
.timeline-loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem 0;
    text-align: center;
}

.loading-spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(var(--color-accent-rgb), 0.1);
    border-top: 3px solid var(--color-accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 1rem;
}

.timeline-loading p {
    color: var(--color-text-light);
    font-size: 0.9rem;
    opacity: 0.8;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* Hide loading when timeline is populated */
.timeline:not(:empty) .timeline-loading {
    display: none;
}
</style>
